# Deploys backend/ to Cloud Run on every push to main that touches
# backend/. Also exposes a manual "Run workflow" button in the GitHub
# Actions tab for ad-hoc redeploys without a commit.
#
# One-time setup (see README at bottom of this file):
#   1. Create a GCP service account with deploy permissions.
#   2. Generate a JSON key and store it as the GitHub secret GCP_SA_KEY.
#   3. Push this file to main; the next backend change auto-deploys.

name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # manual trigger from the Actions tab

env:
  GCP_PROJECT_ID: nextjs-482017
  GCP_REGION: us-central1
  SERVICE_NAME: congress-api

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    # Cancel in-progress runs for the same branch so a quick second
    # push doesn't queue a stale deploy behind a current one.
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --source ./backend \
            --region "${GCP_REGION}" \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')
          echo "Deployed URL: ${URL}"
          # Hit /api/bills with limit=1 and require a 200.
          # If this fails the run is marked red so we notice in GitHub.
          code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/bills?limit=1")
          echo "GET /api/bills -> ${code}"
          test "${code}" = "200"
